name: CPU study checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install hash-pinned CPU profile
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-cpu.lock
      - name: Offline Python contracts
        env:
          PYTHONPATH: tests/audit:src:.
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python -m pytest -q
