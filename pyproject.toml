[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "legislm"
version = "0.1.0"
description = "Pipeline educacional de LLM treinado do zero sobre o corpus legislativo oficial da Câmara e do Senado"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.14.1",
    "numpy>=2.0",
    "pyarrow>=23.0.1",
    "tokenizers>=0.13.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
